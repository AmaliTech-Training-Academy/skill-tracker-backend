services:
  # ===============================
  # Infrastructure Core
  # ===============================

  discovery-server:
    build:
      context: .
      dockerfile: ./skilltracker-infra/discovery-server/Dockerfile
    image: skilltracker/discovery-server:latest
    env_file: .env
    ports:
      - "8082:8082"
    networks:
      - skilltracker-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    depends_on:
      rabbitmq:
        condition: service_started
      postgres:
        condition: service_started

  config-server:
    build:
      context: .
      dockerfile: ./skilltracker-infra/config-server/Dockerfile
    image: skilltracker/config-server:latest
    env_file: .env
    ports:
      - "8081:8081"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8082/eureka/
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - skilltracker-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  api-gateway:
    build:
      context: .
      dockerfile: ./skilltracker-infra/api-gateway/Dockerfile
    image: skilltracker/api-gateway:latest
    env_file: .env
    ports:
      - "8080:8080"
    environment:
      CONFIG_HOST: config-server
      CONFIG_PORT: 8081
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8082/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-server:8081
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8081
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - skilltracker-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===============================
  # Dependencies
  # ===============================

  redis:
    container_name: redis-cache
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - skilltracker-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    container_name: rabbitmq-broker
    image: rabbitmq:3-management
    env_file: .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
      - "61613:61613"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    networks:
      - skilltracker-network
    command: >
      sh -c "
      rabbitmq-plugins enable rabbitmq_stomp &&
      rabbitmq-server
      "
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    container_name: postgres-db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - skilltracker-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===============================
  # User Service
  # ===============================
  user-service:
    build:
      context: .
      dockerfile: ./skilltracker-services/user-service/Dockerfile
    image: skilltracker/user-service:latest
    container_name: user-service
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8082/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-server:8081
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8084
      cookie.secure: 'true'
      cookie.same-site: 'None'
      cookie.domain: ''
      spring.cloud.config.allow-override: true
      spring.cloud.config.override-system: true
    ports:
      - "8084:8084"
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - skilltracker-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ===============================
  # Ngrok Tunnel
  # ===============================

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    depends_on:
      - api-gateway
    command: http --log=stdout api-gateway:8080
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
      - NGROK_REGION=us
    ports:
      - "4040:4040"
    networks:
      - skilltracker-network

# ===============================
# Networks and Volumes
# ===============================

networks:
  skilltracker-network:
    driver: bridge

volumes:
  redis_data:
  rabbitmq_data:
  postgres_data:
