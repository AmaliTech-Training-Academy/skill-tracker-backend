# docker-compose.yml (root level - shared infrastructure)

services:
  # Service Discovery
  discovery-server:
    build:
      context: .
      dockerfile: ./skilltracker-infra/discovery-server/Dockerfile
    image: skilltracker/discovery-server:latest
    env_file: .env
    ports:
      - "8082:8082"
    networks:
      - skilltracker-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Config Server
  config-server:
    build:
      context: .
      dockerfile: ./skilltracker-infra/config-server/Dockerfile
    image: skilltracker/config-server:latest
    container_name: config-server
    env_file: .env
    ports:
      - "8081:8081"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8082/eureka/
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - skilltracker-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: ./skilltracker-infra/api-gateway/Dockerfile
    image: skilltracker/api-gateway:latest
    container_name: api-gateway
    env_file: .env
    ports:
      - "8080:8080"
    environment:
      CONFIG_HOST: config-server
      CONFIG_PORT: 8081
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8082/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-server:8081
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8081
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - skilltracker-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Centralized Audit MongoDB
  mongodb-audit:
    container_name: mongo-audit-db
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: audit_db
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_AUDIT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_AUDIT_PASSWORD}
    ports:
      - "27021:27017"
    volumes:
      - mongo_audit_data:/data/db
    command: --auth
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skilltracker-network

  # Redis - shared cache
  redis:
    container_name: redis-cache
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - skilltracker-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # RabbitMQ - message broker
  rabbitmq:
    container_name: rabbitmq-broker
    image: rabbitmq:3-management
    env_file: .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - skilltracker-network
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL - Consolidated Database
  postgres:
    container_name: postgres-db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql
    networks:
      - skilltracker-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB - Analytics Service
  mongodb-analytics:
    container_name: mongo-analytics-db
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_ANALYTICS_DB}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ANALYTICS_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ANALYTICS_PASSWORD}
    ports:
      - "27022:27017"
    volumes:
      - mongo_analytics_data:/data/db
    command: --auth
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skilltracker-network

  # MongoDB - Gamification Service
  mongodb-gamification:
    container_name: mongo-gamification-db
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_GAMIFICATION_DB}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_GAMIFICATION_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_GAMIFICATION_PASSWORD}
    ports:
      - "27023:27017"
    volumes:
      - mongo_gamification_data:/data/db
    command: --auth
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skilltracker-network

  # MongoDB - Notification Service
  mongodb-notification:
    container_name: mongo-notification-db
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_NOTIFICATION_DB}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_NOTIFICATION_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_NOTIFICATION_PASSWORD}
    ports:
      - "27024:27017"
    volumes:
      - mongo_notification_data:/data/db
    command: --auth
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skilltracker-network

  # =====================================================
  # BUSINESS SERVICES
  # =====================================================

  # User Service
  user-service:
    build:
      context: .
      dockerfile: ./skilltracker-services/user-service/Dockerfile
    image: skilltracker/user-service:latest
    container_name: user-service
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8082/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-server:8081
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_USER_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8084
    ports:
      - "8084:8084"
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - skilltracker-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Task Service
  task-service:
    build:
      context: .
      dockerfile: ./skilltracker-services/task-service/Dockerfile
    image: skilltracker/task-service:latest
    container_name: task-service
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8082/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-server:8081
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_TASK_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_TASK_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8085
    ports:
      - "8085:8085"
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - skilltracker-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Feedback Service
  feedback-service:
    build:
      context: .
      dockerfile: ./skilltracker-services/feedback-service/Dockerfile
    image: skilltracker/feedback-service:latest
    container_name: feedback-service
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8082/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-server:8081
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_FEEDBACK_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_FEEDBACK_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8090
    ports:
      - "8090:8090"
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - skilltracker-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Payment Service
  payment-service:
    build:
      context: .
      dockerfile: ./skilltracker-services/payment-service/Dockerfile
    image: skilltracker/payment-service:latest
    container_name: payment-service
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8082/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-server:8081
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_PAYMENT_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PAYMENT_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8087
    ports:
      - "8087:8087"
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - skilltracker-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Practice Service
  practice-service:
    build:
      context: .
      dockerfile: ./skilltracker-services/practice-service/Dockerfile
    image: skilltracker/practice-service:latest
    container_name: practice-service
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8082/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-server:8081
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_PRACTICE_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PRACTICE_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8089
    ports:
      - "8089:8089"
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - skilltracker-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Analytics Service
  analytics-service:
    build:
      context: .
      dockerfile: ./skilltracker-services/analytics-service/Dockerfile
    image: skilltracker/analytics-service:latest
    container_name: analytics-service
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8082/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-server:8081
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8081
      SPRING_DATA_MONGODB_HOST: mongodb-analytics
      SPRING_DATA_MONGODB_PORT: 27017
      SPRING_DATA_MONGODB_DATABASE: ${MONGO_ANALYTICS_DB}
      SPRING_DATA_MONGODB_USERNAME: ${MONGO_ANALYTICS_USER}
      SPRING_DATA_MONGODB_PASSWORD: ${MONGO_ANALYTICS_PASSWORD}
      SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE: admin
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SERVER_PORT: 8086
    ports:
      - "8086:8086"
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mongodb-analytics:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - skilltracker-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Gamification Service
  gamification-service:
    build:
      context: .
      dockerfile: ./skilltracker-services/gamification-service/Dockerfile
    image: skilltracker/gamification-service:latest
    container_name: gamification-service
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8082/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-server:8081
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8081
      SPRING_DATA_MONGODB_HOST: mongodb-gamification
      SPRING_DATA_MONGODB_PORT: 27017
      SPRING_DATA_MONGODB_DATABASE: ${MONGO_GAMIFICATION_DB}
      SPRING_DATA_MONGODB_USERNAME: ${MONGO_GAMIFICATION_USER}
      SPRING_DATA_MONGODB_PASSWORD: ${MONGO_GAMIFICATION_PASSWORD}
      SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE: admin
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SERVER_PORT: 8088
    ports:
      - "8088:8088"
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mongodb-gamification:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
