  # Notification Service
  notification-service:
    build:
      context: .
      dockerfile: ./skilltracker-services/notification-service/Dockerfile
    image: skilltracker/notification-service:latest
    container_name: notification-service
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8082/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-server:8081
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8081
      SPRING_DATA_MONGODB_HOST: mongodb-notification
      SPRING_DATA_MONGODB_PORT: 27017
      SPRING_DATA_MONGODB_DATABASE: ${MONGO_NOTIFICATION_DB}
      SPRING_DATA_MONGODB_USERNAME: ${MONGO_NOTIFICATION_USER}
      SPRING_DATA_MONGODB_PASSWORD: ${MONGO_NOTIFICATION_PASSWORD}
      SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE: admin
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_MAIL_HOST: ${MAIL_HOST}
      SPRING_MAIL_PORT: ${MAIL_PORT}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      SERVER_PORT: 8091
    ports:
      - "8091:8091"
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mongodb-notification:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - skilltracker-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # BFF Service
  bff-service:
    build:
      context: .
      dockerfile: ./skilltracker-services/bff-service/Dockerfile
    image: skilltracker/bff-service:latest
    container_name: bff-service
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8082/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-server:8081
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8081
      SPRING_DATA_REDIS_HOST: redis
      SERVER_PORT: 8083
    ports:
      - "8083:8083"
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_healthy
      task-service:
        condition: service_healthy
    networks:
      - skilltracker-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  skilltracker-network:
    driver: bridge

volumes:
  redis_data:
  rabbitmq_data:
  mongo_audit_data:
  postgres_data:
  mongo_analytics_data:
  mongo_gamification_data:
  mongo_notification_data:
